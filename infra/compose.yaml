services:
  database:
    container_name: "postgres-dev"
    image: "postgres:18.0-alpine3.22"
    env_file:
      - ../.env.development
    ports:
      - "5432:5432"
  mail-catcher:
    container_name: "mail-catcher-dev"
    image: "sj26/mailcatcher"
    ports:
      - "1080:1080"
      - "1025:1025"
